<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><title>Teste da conta · Radar Facial</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#060b14;color:#f6f7fb;font:16px/1.6 system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}
    main{width:100%;max-width:470px;background:#111a2c;border:1px solid #39445a;border-radius:20px;padding:28px}h1{font-size:26px;line-height:1.2}p{color:#bdc5d4}a{color:#ffc329}button{width:100%;padding:15px;border:0;border-radius:12px;background:#ffc329;color:#10151d;font-weight:750;font-size:16px;cursor:pointer}button:disabled{opacity:.5;cursor:default}#status{min-height:52px}small{display:block;color:#a3adc0;margin:18px 0}
  </style>
  <script src="/auth.js" defer></script><script src="/test-credit.js" defer></script>
</head>
<body><main>
  <h1>Teste da sua conta</h1>
  <p>Libere 1 crédito quando seu saldo estiver zerado. Disponível somente para a conta autorizada.</p>
  <p id="status" role="status" aria-live="polite">Verificando sua sessão…</p>
  <button id="grant" disabled>Liberar 1 crédito de teste</button>
  <small>Buscas reais continuam consumindo saldo da FaceCheck. Esta liberação não é uma compra e não gera comissão.</small>
  <a href="/">Voltar ao Radar Facial</a>
</main></body></html>
